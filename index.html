<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: #f0f6fc;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 1.25rem;
            color: #f0f6fc;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        /* Todo List Styles */
        .todo-input-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .todo-input-container input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .todo-input-container input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            background-color: var(--accent-hover);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent);
            color: #0d1117;
        }

        ul {
            list-style: none;
        }

        ul li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.65rem 0.75rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        ul li.completed span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .icon-btn:hover {
            color: var(--accent);
        }

        /* Budget / Quick Info Styles */
        .budget-stats {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stat-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #f0f6fc;
        }

        /* Notes / Dashboard Textarea Styles */
        textarea {
            width: 100%;
            height: 150px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Central Command</h1>
        <p>Your personal dashboard to track life, tasks, and budgets.</p>
    </header>

    <div class="dashboard-grid">
        <!-- To-Do List Card -->
        <div class="card">
            <h2>To-Do List</h2>
            <div class="todo-input-container">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button class="btn" onclick="addTask()">Add</button>
            </div>
            <ul id="taskList">
                <!-- Sample task item -->
                <li>
                    <span>Review project roadmap</span>
                    <div class="task-actions">
                        <button class="icon-btn" onclick="toggleTask(this)">✓</button>
                        <button class="icon-btn" onclick="deleteTask(this)">✕</button>
                    </div>
                </li>
            </ul>
        </div>

        <!-- Budget Overview Card -->
        <div class="card">
            <h2>Budget Overview</h2>
            <div class="budget-stats">
                <div class="stat-item">
                    <span class="stat-label">Monthly Budget</span>
                    <span class="stat-value">$3,500.00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Spent So Far</span>
                    <span class="stat-value" style="color: #f85149;">$1,250.00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Remaining</span>
                    <span class="stat-value" style="color: #3fb950;">$2,250.00</span>
                </div>
            </div>
        </div>

        <!-- Daily Notes Card -->
        <div class="card">
            <h2>Daily Notes & Thoughts</h2>
            <textarea placeholder="Write down your daily goals, ideas, or reminders here..."></textarea>
        </div>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();
            if(!taskText) return;

            const list = document.getElementById('taskList');
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${taskText}</span>
                <div class="task-actions">
                    <button class="icon-btn" onclick="toggleTask(this)">✓</button>
                    <button class="icon-btn" onclick="deleteTask(this)">✕</button>
                </div>
            `;
            list.appendChild(li);
            input.value = '';
        }

        function toggleTask(btn) {
            const li = btn.closest('li');
            li.classList.toggle('completed');
        }

        function deleteTask(btn) {
            const li = btn.closest('li');
            li.remove();
        }
    </script>
</body>
</html>
